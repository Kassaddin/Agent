schema_version: 1
project: "Replace with the active project name"
layout: one_view
root_view: project
views:
  - id: project
    path: CONTEXT.md
    source_ids: [terms, decisions, specification]
sources:
  - id: terms
    resource: project
    path: GLOSSARY.md
    role: glossary
    owner: glossary
    section: null
    reviewed_sha256: null
    reviewed_at: null
  - id: decisions
    resource: project
    path: DISCUSSION.md
    role: decision_record
    owner: refine
    section: null
    reviewed_sha256: null
    reviewed_at: null
  - id: specification
    resource: project
    path: docs/specification.md
    role: documentation
    owner: to-document
    section: null
    reviewed_sha256: null
    reviewed_at: null
topics:
  - id: delivery
    decision_source_id: decisions
    view_ids: [project]
