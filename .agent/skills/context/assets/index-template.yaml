# Example only: replace namespace prefixes, resource IDs, and host document paths.
# A wrapped kit uses Agents/.agent/... relative to the primary host root.
schema_version: 2
project: "Replace with the active project name"
layout: one_view
root_view: project
views:
  - id: project
    path: .agent/context/project.md
    source_ids: [terms, decisions, specification]
sources:
  - id: terms
    resource: project
    path: docs/glossary.md
    role: glossary
    owner: glossary
    section: null
    reviewed_sha256: null
    reviewed_at: null
  - id: decisions
    resource: project
    path: docs/topics/delivery/decisions.md
    role: decision_record
    owner: refine
    section: null
    reviewed_sha256: null
    reviewed_at: null
  - id: specification
    resource: project
    path: docs/specification.md
    role: documentation
    owner: to-document
    section: null
    reviewed_sha256: null
    reviewed_at: null
topics:
  - id: delivery
    decision_source_id: decisions
    checkpoint_path: .agent/state/checkpoints/delivery.yaml
    view_ids: [project]
