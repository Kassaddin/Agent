schema_version: 2
max_automatic_escalations: 1
# Candidates are ordered by preference. Routing picks the first one whose model
# and effort the host reports as supported.
profiles:
  Routine:
    candidates:
      - model: gpt-6-luna
        effort: low
      - model: claude-haiku-5.5
        effort: low
      - model: gemini-3.8-flash
        effort: low
  Standard:
    candidates:
      - model: gpt-6.2-sol
        effort: medium
      - model: claude-sonnet-5.5
        effort: medium
      - model: gemini-4-carbon
        effort: medium
  Demanding:
    candidates:
      - model: gpt-6.2-sol
        effort: high
        escalated_effort: xhigh
      - model: claude-opus-5.5
        effort: high
        escalated_effort: xhigh
      - model: gemini-4-neon
        effort: high
        escalated_effort: xhigh
# Master control entries orchestrator and elevated-rights have no worker profile.
skill_profiles:
  search: Routine
  backlog: Routine
  glossary: Standard
  google: Standard
  project-context: Standard
  init: Standard
  setup: Standard
  update: Standard
  fix: Standard
  implement: Standard
  create-skill: Standard
  to-document: Standard
  refine: Demanding
  research: Demanding
  to-tasks: Demanding
  smokes: Demanding
